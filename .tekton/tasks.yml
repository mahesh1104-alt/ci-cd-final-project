apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Cleans up the workspace directory before and after pipeline execution.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        echo "Cleaning up workspace directory..."
        rm -rf * .[!.]*
        echo "Workspace cleanup completed successfully."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Runs automated unit tests against the Python codebase using the nose test runner.
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        echo "Installing requirements and test dependencies..."
        pip install --no-cache-dir nose flake8
        echo "Executing nose unit tests..."
        nosetests -v
